version: '3.8'
services:
  drupal:
    image: drupal:9.5
    ports:
      - "8080:80"
    volumes:
      - ./modules:/var/www/html/modules/custom
    depends_on:
      - db
  db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal
      MYSQL_ROOT_PASSWORD: root
