# .forgejo/workflows/drupal.yml
name: Drupal CI (Forgejo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drupal-test:
    # One container that provides BOTH Node (for actions) AND PHP (for our script)
    runs-on: codeberg-small
    container:
      image: node:20-bullseye          # Node pre‑installed
      options: --user root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout the repository (needs Node → now works)
      # --------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 2️⃣ Install OS packages: PHP, extensions, git, unzip, etc.
      # --------------------------------------------------------------
      - name: Install PHP, extensions & utilities
        run: |
          set -eux
          apt-get update

          # basic tools
          apt-get install -y git unzip curl ca-certificates gnupg2 lsb-release

          # add the official PHP repo (deb.sury.org) – gives us newer PHP versions
          curl -fsSL https://packages.sury.org/php/apt.gpg | gpg --dearmor -o /usr/share/keyrings/php-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/php-archive-keyring.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" \
            > /etc/apt/sources.list.d/php.list
          apt-get update

          # install PHP 8.2 + needed extensions
          apt-get install -y php8.2-cli php8.2-common php8.2-fpm \
            php8.2-mbstring php8.2-intl php8.2-pdo php8.2-mysql \
            php8.2-gd php8.2-zip php8.2-opcache php8.2-bcmath \
            php8.2-xml php8.2-curl

          # make the php binary the default `php` command
          update-alternatives --set php /usr/bin/php8.2

          php -v

      # --------------------------------------------------------------
      # 3️⃣ Install Composer (official installer)
      # --------------------------------------------------------------
      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"
          composer --version

      # --------------------------------------------------------------
      # 4️⃣ Pull in Composer dependencies (Drupal core + any modules)
      # --------------------------------------------------------------
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      # --------------------------------------------------------------
      # 5️⃣ Prepare a minimal settings.php that points at the MySQL service
      # --------------------------------------------------------------
      - name: Prepare settings.php
        run: |
          cp web/sites/default/default.settings.php web/sites/default/settings.php
          cat <<'EOF' >> web/sites/default/settings.php
          $databases['default']['default'] = [
            'driver' => 'mysql',
            'database' => 'drupal',
            'username' => 'drupal',
            'password' => 'drupal',
            'host' => '127.0.0.1',
            'port' => '3306',
            'prefix' => '',
          ];
          EOF
          chmod 664 web/sites/default/settings.php

      # --------------------------------------------------------------
      # 6️⃣ Install the site (minimal profile) and run DB updates
      # --------------------------------------------------------------
      - name: Install Drupal site
        env:
          DRUPAL_SITE_NAME: "CI Test Site"
          DRUPAL_ACCOUNT_NAME: admin
          DRUPAL_ACCOUNT_PASS: admin123
        run: |
          vendor/bin/drush site:install minimal \
            --site-name="${DRUPAL_SITE_NAME}" \
            --account-name="${DRUPAL_ACCOUNT_NAME}" \
            --account-pass="${DRUPAL_ACCOUNT_PASS}" \
            --yes

      - name: Run database updates
        run: vendor/bin/drush updatedb -y

      # --------------------------------------------------------------
      # 7️⃣ Enable a few core modules (prove “enable stuff” works)
      # --------------------------------------------------------------
      - name: Enable core modules
        run: |
          vendor/bin/drush en path toolbar block -y

      # --------------------------------------------------------------
      # 8️⃣ Run a quick PHPUnit smoke‑test suite
      # --------------------------------------------------------------
      - name: Run PHPUnit
        env:
          SIMPLETEST_BASE_URL: http://localhost
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
        run: |
          vendor/bin/phpunit -c core phpunit.xml.dist --testsuite=unit --exclude-group=skipOnTravis

      # --------------------------------------------------------------
      # 9️⃣ Optional: cache Composer downloads for faster next runs
      # --------------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-