# .forgejo/workflows/drupal.yml
name: Drupal CI (Forgejo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drupal-test:
    # Run the whole job inside a PHP image that already has the interpreter.
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli               # Official PHP CLI image (Debian‑based)
      options: --user root             # Needed so we can apt‑get install packages

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout the repository (Forgejo provides the same step)
      # --------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4   # This is a generic checkout step that works on Forgejo

      # --------------------------------------------------------------
      # 2️⃣ Install system dependencies (PHP extensions, git, unzip)
      # --------------------------------------------------------------
      - name: Install OS packages & PHP extensions
        run: |
          apt-get update && apt-get install -y \
            git \
            unzip \
            libzip-dev \
            libpng-dev \
            libjpeg62-turbo-dev \
            libfreetype6-dev \
            zlib1g-dev \
            libicu-dev \
            libonig-dev \
            libxml2-dev \
            default-mysql-client \
            && docker-php-ext-configure gd --with-freetype --with-jpeg \
            && docker-php-ext-install -j$(nproc) \
                bcmath \
                intl \
                mbstring \
                pdo_mysql \
                zip \
                gd \
                opcache

      # --------------------------------------------------------------
      # 3️⃣ Install Composer (official installer)
      # --------------------------------------------------------------
      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"
          composer --version

      # --------------------------------------------------------------
      # 4️⃣ Pull in Composer dependencies (Drupal core + any modules)
      # --------------------------------------------------------------
      - name: Composer install
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      # --------------------------------------------------------------
      # 5️⃣ Build a minimal settings.php that points at the MySQL service
      # --------------------------------------------------------------
      - name: Prepare settings.php
        run: |
          cp web/sites/default/default.settings.php web/sites/default/settings.php
          cat <<'EOF' >> web/sites/default/settings.php
          $databases['default']['default'] = [
            'driver' => 'mysql',
            'database' => 'drupal',
            'username' => 'drupal',
            'password' => 'drupal',
            'host' => '127.0.0.1',
            'port' => '3306',
            'prefix' => '',
          ];
          EOF
          chmod 664 web/sites/default/settings.php

      # --------------------------------------------------------------
      # 6️⃣ Install the site (minimal profile) and run DB updates
      # --------------------------------------------------------------
      - name: Install Drupal site
        env:
          DRUPAL_SITE_NAME: "CI Test Site"
          DRUPAL_ACCOUNT_NAME: admin
          DRUPAL_ACCOUNT_PASS: admin123
        run: |
          vendor/bin/drush site:install minimal \
            --site-name="${DRUPAL_SITE_NAME}" \
            --account-name="${DRUPAL_ACCOUNT_NAME}" \
            --account-pass="${DRUPAL_ACCOUNT_PASS}" \
            --yes

      - name: Run database updates
        run: vendor/bin/drush updatedb -y

      # --------------------------------------------------------------
      # 7️⃣ Enable a couple of core modules (prove “enable stuff” works)
      # --------------------------------------------------------------
      - name: Enable core modules
        run: |
          vendor/bin/drush en path toolbar block -y

      # --------------------------------------------------------------
      # 8️⃣ Run a quick PHPUnit smoke‑test suite
      # --------------------------------------------------------------
      - name: Run PHPUnit
        env:
          SIMPLETEST_BASE_URL: http://localhost
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
        run: |
          vendor/bin/phpunit -c core phpunit.xml.dist --testsuite=unit --exclude-group=skipOnTravis
